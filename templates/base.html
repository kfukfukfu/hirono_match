<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ _('app.name') }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="{{ url_for('index') }}" class="logo">{{ _('app.name') }}</a>
            <div class="header-actions">
                <nav class="lang-switch" aria-label="{{ _('lang.switch_label') }}">
                    <a href="{{ url_for('set_language', lang_code='ja') }}"
                       class="lang-switch-btn{% if lang == 'ja' %} is-active{% endif %}"
                       lang="ja">{{ _('lang.ja') }}</a>
                    <span class="lang-switch-sep" aria-hidden="true">|</span>
                    <a href="{{ url_for('set_language', lang_code='en') }}"
                       class="lang-switch-btn{% if lang == 'en' %} is-active{% endif %}"
                       lang="en">{{ _('lang.en') }}</a>
                </nav>
                <nav class="nav-links">
                    <a href="{{ url_for('diagnosis') }}">{{ _('nav.diagnosis') }}</a>
                    <a href="{{ url_for('favorites') }}">{{ _('nav.favorites') }}</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <nav class="footer-links" aria-label="{{ _('footer.nav_label') }}">
                <a href="{{ url_for('contact') }}">{{ _('nav.contact') }}</a>
            </nav>
            <p>{{ _('footer.copyright') }}</p>
        </div>
    </footer>

    <script>
        window.HIRONO_I18N = {
            favoritesRemove: {{ _('favorites.remove') | tojson }}
        };
    </script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
