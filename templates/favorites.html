{% extends "base.html" %}

{% block title %}{{ _('favorites.page_title') }}{% endblock %}

{% block content %}
<section class="favorites container">
    <h1 class="page-title">{{ _('favorites.title') }}</h1>
    <p class="page-lead">{{ _('favorites.lead') }}</p>

    <div id="favorites-list" class="spot-grid">
        <!-- JavaScript で localStorage から描画 -->
    </div>

    <p id="favorites-empty" class="empty-message" hidden>
        {{ _('favorites.empty') }}
    </p>

    <div class="result-actions">
        <a href="{{ url_for('diagnosis') }}" class="btn btn-primary">{{ _('favorites.start_diagnosis') }}</a>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", function () {
        Favorites.renderList("#favorites-list", "#favorites-empty");
    });
</script>
{% endblock %}
